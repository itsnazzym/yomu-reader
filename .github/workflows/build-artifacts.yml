name: Build & Package Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version du tag (ex: v1.0.0)"
        required: false
        type: string
        default: ""
      release_title:
        description: "Titre de la release (laisser vide pour automatique)"
        required: false
        type: string
        default: ""
      release_notes:
        description: "Notes de mise à jour (court et concis)"
        required: false
        type: string
        default: ""
      create_release:
        description: "Créer / Publier la release sur GitHub"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Android Builds (ARM64-v8a, Universal Full, Debug)
  # ─────────────────────────────────────────────────────────────────────────────
  android-apks:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Génération d'un Keystore de Release dédié..."
            keytool -genkeypair -v -keystore release.keystore -alias yomureader -keyalg RSA -keysize 2048 -validity 10000 -storepass yomureader_release_key -keypass yomureader_release_key -dname "CN=Yomu Reader, OU=Mobile, O=nHentai Launcher, L=Paris, ST=IDF, C=FR"
            echo "KEYSTORE_PASS=yomureader_release_key" >> $GITHUB_ENV
            echo "KEY_ALIAS=yomureader" >> $GITHUB_ENV
            echo "KEY_PASS=yomureader_release_key" >> $GITHUB_ENV
          fi

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Prebuild (Generate Android native project)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradlew Executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Prepare Artifacts Directory
        run: mkdir -p build-output/apks

      # --- 1. APK Release ARM64-v8a (Lightweight & Optimized) ---
      - name: Build and Sign ARM64-v8a Release APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET_APK="../../build-output/apks/YomuReader-arm64-v8a-release.apk"
          cp "$RAW_APK" "$TARGET_APK"
          
          # Signature officielle via apksigner (v1, v2, v3)
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" sign --ks ../../release.keystore --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$TARGET_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$TARGET_APK"

      # --- 2. APK Release Full Universal (All ABIs: arm64-v8a, armeabi-v7a, x86, x86_64) ---
      - name: Build and Sign Universal Full Release APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --no-daemon
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET_APK="../../build-output/apks/YomuReader-universal-full-release.apk"
          cp "$RAW_APK" "$TARGET_APK"
          
          # Signature officielle via apksigner (v1, v2, v3)
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" sign --ks ../../release.keystore --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$TARGET_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$TARGET_APK"

      # --- 3. APK Debug ---
      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleDebug --no-daemon
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$DEBUG_APK" ../../build-output/apks/YomuReader-debug.apk

      - name: Upload Android APKs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build-output/apks/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Windows Desktop .EXE Portable (Electron)
  # ─────────────────────────────────────────────────────────────────────────────
  windows-portable:
    name: Build Windows .EXE Portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Desktop Dependencies
        run: npm ci

      - name: Build Desktop Frontend
        run: npm run build

      - name: Package Windows Portable Executable
        run: npx electron-builder --win portable --publish never

      - name: Prepare Windows Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-output/windows | Out-Null
          $exe = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item -Path $exe.FullName -Destination "build-output/windows/nHentai-Launcher-Portable.exe"
          } else {
            throw "Portable .exe non trouvé dans release/"
          }

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: build-output/windows/*.exe
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Clean Source Code ZIP Archive
  # ─────────────────────────────────────────────────────────────────────────────
  source-zip:
    name: Package Source Code ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Clean Git Archive ZIP
        run: |
          mkdir -p build-output/source
          git archive --format=zip --prefix=nhentai-launcher/ HEAD -o build-output/source/nhentai-launcher-source.zip

      - name: Upload Source ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code-zip
          path: build-output/source/nhentai-launcher-source.zip
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. GitHub Release (Published if tagged or manually requested)
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [android-apks, windows-portable, source-zip]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Structured Release Notes & Checksums
        id: release_meta
        run: |
          # 1. Détermination de la version et du tag
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")
            TAG_VER="v${PKG_VERSION}"
          fi
          echo "tag_name=$TAG_VER" >> $GITHUB_OUTPUT

          # 2. Détermination du titre de la release
          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="🌸 Release ${TAG_VER} — nHentai Launcher & Yomu Reader"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          # 3. Calcul des sommes de contrôle SHA-256
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

          # 4. Récupération des notes personnalisées ou valeur par défaut
          CUSTOM_NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$CUSTOM_NOTES" ]; then
            CUSTOM_NOTES="Mise à jour de maintenance et d'optimisation pour l'application Mobile (Android) et Desktop (Windows)."
          fi

          # 5. Construction du corps Markdown structuré et ordonné
          cat << 'EOF' > release_body.md
          ## ✨ Notes de mise à jour
          EOF
          
          echo "$CUSTOM_NOTES" >> release_body.md

          cat << 'EOF' >> release_body.md

          ---

          ### 📥 Téléchargements & Paquets disponibles

          | Fichier | Plateforme / Architecture | Description |
          | :--- | :--- | :--- |
          | 📱 **`YomuReader-arm64-v8a-release.apk`** | **Android 64-bit (Recommandé)** | Version ultra-légère et optimisée pour smartphones récents (~35 Mo) |
          | 📱 **`YomuReader-universal-full-release.apk`** | **Android Universel (Tous processeurs)** | Compatible 100% appareils Android (ARMv7, ARM64, x86, x86_64) |
          | 📱 **`YomuReader-debug.apk`** | **Android Debug / Dev** | Version de test avec React Native DevTools activés |
          | 💻 **`nHentai-Launcher-Portable.exe`** | **Windows 64-bit** | Exécutable autonome sans installation (lanceur Desktop complet) |
          | 🗜️ **`nhentai-launcher-source.zip`** | **Code Source** | Archive ZIP propre du code source Git |

          ---

          ### 🛡️ Empreintes d'intégrité (SHA-256)
          ```text
          EOF

          cat release-assets/SHA256SUMS.txt >> release_body.md

          cat << 'EOF' >> release_body.md
          ```

          ---
          <sub>*Paquets compilés et signés automatiquement par le pipeline CI/CD GitHub Actions.*</sub>
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: release_body.md
          files: release-assets/*
          draft: false
          prerelease: false
