name: Build & Package Artifacts

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version du tag (ex: v1.0.8). Vide = incrément automatique"
        required: false
        type: string
        default: ""
      release_title:
        description: "Titre de la release (laisser vide pour automatique)"
        required: false
        type: string
        default: ""
      release_notes:
        description: "Notes de mise à jour (court et concis)"
        required: false
        type: string
        default: ""
      create_release:
        description: "Créer / Publier la release sur GitHub"
        required: false
        type: boolean
        default: true
      build_universal:
        description: "Inclure l'APK universel 4 ABIs (~15 min de plus)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-artifacts
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Calcul de la prochaine version (tag + app + release)
  # ─────────────────────────────────────────────────────────────────────────────
  prepare-version:
    name: 🏷️ Prepare next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      version_code: ${{ steps.bump.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next semver tag
        id: bump
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          normalize_version() {
            local raw="$1"
            raw="${raw#v}"
            if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version invalide (attendu x.y.z): $1" >&2
              exit 1
            fi
            echo "$raw"
          }

          tag_exists() {
            git rev-parse -q --verify "refs/tags/$1" >/dev/null 2>&1
          }

          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="$(normalize_version "${INPUT_VERSION}")"
          else
            LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
            if [ -z "${LATEST}" ]; then
              VERSION="1.0.1"
            else
              RAW="$(normalize_version "${LATEST}")"
              IFS='.' read -r MAJOR MINOR PATCH <<< "${RAW}"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi

          TAG="v${VERSION}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
          while tag_exists "${TAG}"; do
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"
          done

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "Next release: ${TAG} (versionCode=${RUN_NUMBER})"

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Android prebuild partagé (1× npm ci + expo prebuild pour tous les APK)
  # ─────────────────────────────────────────────────────────────────────────────
  android-prepare:
    name: 🤖 Android prebuild (shared)
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply release version
        env:
          APP_VERSION: ${{ needs.prepare-version.outputs.version }}
          APP_VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: node .github/scripts/apply-release-version.cjs

      - name: Install dependencies & prebuild Android once
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Upload prebuilt android/ tree
        uses: actions/upload-artifact@v4
        with:
          name: android-prebuild
          path: mobile/android/
          retention-days: 1
          compression-level: 6

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Android ARM64-v8a Release
  # ─────────────────────────────────────────────────────────────────────────────
  build-arm64-apk:
    name: 📱 Android ARM64-v8a Release
    needs: [prepare-version, android-prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore shared Android prebuild
        uses: actions/download-artifact@v4
        with:
          name: android-prebuild
          path: mobile/android

      - name: Install node_modules (native module paths for Gradle)
        working-directory: mobile
        run: npm ci

      - name: Restore production release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Add it in repo Settings > Secrets > Actions." >&2
            exit 1
          fi
          mkdir -p mobile/android/app
          echo "${KEYSTORE_BASE64}" | base64 -d > mobile/android/app/release-key.keystore
          echo "Keystore restored ($(wc -c < mobile/android/app/release-key.keystore) bytes)"

      - name: Build & Sign ARM64-v8a APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.caching=true"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash .github/scripts/android-gradle-build.sh assembleRelease arm64-v8a
          mkdir -p output-arm64
          RAW_APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$RAW_APK" output-arm64/YomuReader-arm64-v8a-release.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: output-arm64/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Android Universal (manuel uniquement — 4 ABIs, très long)
  # ─────────────────────────────────────────────────────────────────────────────
  build-universal-apk:
    name: 📱 Android Universal Full Release
    needs: [prepare-version, android-prepare]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_universal != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore shared Android prebuild
        uses: actions/download-artifact@v4
        with:
          name: android-prebuild
          path: mobile/android

      - name: Install node_modules (native module paths for Gradle)
        working-directory: mobile
        run: npm ci

      - name: Restore production release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Add it in repo Settings > Secrets > Actions." >&2
            exit 1
          fi
          mkdir -p mobile/android/app
          echo "${KEYSTORE_BASE64}" | base64 -d > mobile/android/app/release-key.keystore
          echo "Keystore restored ($(wc -c < mobile/android/app/release-key.keystore) bytes)"

      - name: Build & Sign Universal APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.caching=true"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash .github/scripts/android-gradle-build.sh assembleRelease "armeabi-v7a,arm64-v8a,x86,x86_64"
          mkdir -p output-universal
          RAW_APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$RAW_APK" output-universal/YomuReader-universal-full-release.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: output-universal/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Android Debug APK
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug-apk:
    name: 📱 Android Debug APK
    needs: [prepare-version, android-prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore shared Android prebuild
        uses: actions/download-artifact@v4
        with:
          name: android-prebuild
          path: mobile/android

      - name: Install node_modules (native module paths for Gradle)
        working-directory: mobile
        run: npm ci

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.caching=true"
        run: |
          bash .github/scripts/android-gradle-build.sh assembleDebug
          mkdir -p output-debug
          RAW_APK=$(find mobile/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$RAW_APK" output-debug/YomuReader-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: output-debug/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Windows Desktop .EXE Portable (Electron)
  # ─────────────────────────────────────────────────────────────────────────────
  windows-portable:
    name: 💻 Windows .EXE Portable
    needs: prepare-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply release version
        env:
          APP_VERSION: ${{ needs.prepare-version.outputs.version }}
          APP_VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: node .github/scripts/apply-release-version.cjs

      - name: Install Desktop Dependencies
        run: npm ci

      - name: Build Desktop Frontend
        run: npm run build

      - name: Package Windows Portable Executable
        run: npx electron-builder --win portable --publish never

      - name: Prepare Windows Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output-windows | Out-Null
          $exe = Get-ChildItem -Path release -Filter "YomuReader*.exe" | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          }
          if ($exe) {
            Copy-Item -Path $exe.FullName -Destination "output-windows/YomuReader-Portable.exe"
          } else {
            throw "Portable .exe non trouvé dans release/"
          }

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: output-windows/*.exe
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Clean Source Code ZIP Archive
  # ─────────────────────────────────────────────────────────────────────────────
  source-zip:
    name: 🗜️ Package Source Code ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Clean Git Archive ZIP
        run: |
          mkdir -p output-source
          git archive --format=zip --prefix=nhentai-launcher/ HEAD -o output-source/nhentai-launcher-source.zip

      - name: Upload Source ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code-zip
          path: output-source/nhentai-launcher-source.zip
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: 🚀 Publish GitHub Release
    needs:
      - prepare-version
      - android-prepare
      - build-arm64-apk
      - build-universal-apk
      - build-debug-apk
      - windows-portable
      - source-zip
    if: |
      (github.event_name == 'push' || github.event.inputs.create_release != 'false') &&
      always() &&
      !cancelled() &&
      needs.prepare-version.result == 'success' &&
      needs.android-prepare.result == 'success' &&
      needs.build-arm64-apk.result == 'success' &&
      needs.build-debug-apk.result == 'success' &&
      needs.windows-portable.result == 'success' &&
      needs.source-zip.result == 'success' &&
      (needs.build-universal-apk.result == 'success' || needs.build-universal-apk.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Structured Release Notes & Checksums
        id: release_meta
        env:
          TAG_VER: ${{ needs.prepare-version.outputs.tag }}
          INPUT_TITLE: ${{ github.event.inputs.release_title }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          HAS_UNIVERSAL: ${{ needs.build-universal-apk.result }}
        run: |
          if [ -z "${TAG_VER}" ]; then
            echo "Tag de release manquant" >&2
            exit 1
          fi
          echo "tag_name=${TAG_VER}" >> "${GITHUB_OUTPUT}"

          if [ -n "${INPUT_TITLE}" ]; then
            TITLE="${INPUT_TITLE}"
          else
            TITLE="Yomu Reader ${TAG_VER}"
          fi
          echo "title=${TITLE}" >> "${GITHUB_OUTPUT}"

          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

          CUSTOM_NOTES="${INPUT_NOTES}"
          if [ -z "$CUSTOM_NOTES" ]; then
            CUSTOM_NOTES="$(git log -1 --pretty=%s)"
          fi

          cat << 'EOF' > release_body.md
          ## ✨ Notes de mise à jour
          EOF

          echo "$CUSTOM_NOTES" >> release_body.md

          cat << 'EOF' >> release_body.md

          ---

          ### 📥 Téléchargements & Paquets disponibles

          | Fichier | Plateforme / Architecture | Description |
          | :--- | :--- | :--- |
          | 📱 **`YomuReader-arm64-v8a-release.apk`** | **Android 64-bit (Recommandé)** | Version optimisée pour smartphones récents (~35 Mo) |
          EOF

          if [ "${HAS_UNIVERSAL}" = "success" ]; then
            cat << 'EOF' >> release_body.md
          | 📱 **`YomuReader-universal-full-release.apk`** | **Android Universel (Tous processeurs)** | Compatible ARMv7, ARM64, x86, x86_64 |
          EOF
          else
            cat << 'EOF' >> release_body.md
          | 📱 *APK universel* | — | Disponible via **Actions → Run workflow** avec l'option *build_universal* |
          EOF
          fi

          cat << 'EOF' >> release_body.md
          | 📱 **`YomuReader-debug.apk`** | **Android Debug / Dev** | Version de test avec React Native DevTools activés |
          | 💻 **`YomuReader-Portable.exe`** | **Windows 64-bit** | Exécutable autonome sans installation |
          | 🗜️ **`nhentai-launcher-source.zip`** | **Code Source** | Archive ZIP propre du code source Git |

          ---

          ### 🛡️ Empreintes d'intégrité (SHA-256)
          ```text
          EOF

          cat release-assets/SHA256SUMS.txt >> release_body.md

          cat << 'EOF' >> release_body.md
          ```

          ---
          <sub>*Paquets compilés et signés automatiquement par le pipeline CI/CD GitHub Actions.*</sub>
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: release_body.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
