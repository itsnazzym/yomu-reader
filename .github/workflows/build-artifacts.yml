name: Build & Package Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version du tag (ex: v1.0.0)"
        required: false
        type: string
        default: ""
      release_title:
        description: "Titre de la release (laisser vide pour automatique)"
        required: false
        type: string
        default: ""
      release_notes:
        description: "Notes de mise à jour (court et concis)"
        required: false
        type: string
        default: ""
      create_release:
        description: "Créer / Publier la release sur GitHub"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Android ARM64-v8a Release (Ultra Rapide & Recommandé pour tous téléphones)
  # ─────────────────────────────────────────────────────────────────────────────
  build-arm64-apk:
    name: 📱 Android ARM64-v8a Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias yomureader -keyalg RSA -keysize 2048 -validity 10000 -storepass yomureader_release_key -keypass yomureader_release_key -dname "CN=Yomu Reader, OU=Mobile, O=nHentai Launcher, L=Paris, ST=IDF, C=FR"

      - name: Bump android versionCode from run number
        working-directory: mobile
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.android.versionCode=parseInt(process.env.GITHUB_RUN_NUMBER,10);fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n');console.log('versionCode='+j.expo.android.versionCode)"
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Install Dependencies & Prebuild
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Build & Sign ARM64-v8a APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache --parallel
          
          mkdir -p ../../output-arm64
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET_APK="../../output-arm64/YomuReader-arm64-v8a-release.apk"
          cp "$RAW_APK" "$TARGET_APK"
          
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" sign --ks ../../release.keystore --ks-pass "pass:yomureader_release_key" --key-pass "pass:yomureader_release_key" --ks-key-alias "yomureader" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$TARGET_APK"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: output-arm64/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Android Universal Full Release (Tous processeurs)
  # ─────────────────────────────────────────────────────────────────────────────
  build-universal-apk:
    name: 📱 Android Universal Full Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias yomureader -keyalg RSA -keysize 2048 -validity 10000 -storepass yomureader_release_key -keypass yomureader_release_key -dname "CN=Yomu Reader, OU=Mobile, O=nHentai Launcher, L=Paris, ST=IDF, C=FR"

      - name: Bump android versionCode from run number
        working-directory: mobile
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.android.versionCode=parseInt(process.env.GITHUB_RUN_NUMBER,10);fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n');console.log('versionCode='+j.expo.android.versionCode)"
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Install Dependencies & Prebuild
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Build & Sign Universal APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --build-cache --parallel
          
          mkdir -p ../../output-universal
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET_APK="../../output-universal/YomuReader-universal-full-release.apk"
          cp "$RAW_APK" "$TARGET_APK"
          
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" sign --ks ../../release.keystore --ks-pass "pass:yomureader_release_key" --key-pass "pass:yomureader_release_key" --ks-key-alias "yomureader" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$TARGET_APK"

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: output-universal/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Android Debug APK
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug-apk:
    name: 📱 Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies & Prebuild
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel
          
          mkdir -p ../../output-debug
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$RAW_APK" ../../output-debug/YomuReader-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: output-debug/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Windows Desktop .EXE Portable (Electron)
  # ─────────────────────────────────────────────────────────────────────────────
  windows-portable:
    name: 💻 Windows .EXE Portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Desktop Dependencies
        run: npm ci

      - name: Build Desktop Frontend
        run: npm run build

      - name: Package Windows Portable Executable
        run: npx electron-builder --win portable --publish never

      - name: Prepare Windows Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output-windows | Out-Null
          $exe = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item -Path $exe.FullName -Destination "output-windows/nHentai-Launcher-Portable.exe"
          } else {
            throw "Portable .exe non trouvé dans release/"
          }

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: output-windows/*.exe
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Clean Source Code ZIP Archive
  # ─────────────────────────────────────────────────────────────────────────────
  source-zip:
    name: 🗜️ Package Source Code ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Clean Git Archive ZIP
        run: |
          mkdir -p output-source
          git archive --format=zip --prefix=nhentai-launcher/ HEAD -o output-source/nhentai-launcher-source.zip

      - name: Upload Source ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code-zip
          path: output-source/nhentai-launcher-source.zip
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. GitHub Release (Runs immediately when all 5 parallel jobs finish)
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-arm64-apk, build-universal-apk, build-debug-apk, windows-portable, source-zip]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Structured Release Notes & Checksums
        id: release_meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")
            TAG_VER="v${PKG_VERSION}"
          fi
          echo "tag_name=$TAG_VER" >> $GITHUB_OUTPUT

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="🌸 Release ${TAG_VER} — nHentai Launcher & Yomu Reader"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

          CUSTOM_NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$CUSTOM_NOTES" ]; then
            CUSTOM_NOTES="Mise à jour officielle et optimisée pour l'application Mobile (Android) et Desktop (Windows)."
          fi

          cat << 'EOF' > release_body.md
          ## ✨ Notes de mise à jour
          EOF
          
          echo "$CUSTOM_NOTES" >> release_body.md

          cat << 'EOF' >> release_body.md

          ---

          ### 📥 Téléchargements & Paquets disponibles

          | Fichier | Plateforme / Architecture | Description |
          | :--- | :--- | :--- |
          | 📱 **`YomuReader-arm64-v8a-release.apk`** | **Android 64-bit (Recommandé)** | Version ultra-légère et optimisée pour smartphones récents (~35 Mo) |
          | 📱 **`YomuReader-universal-full-release.apk`** | **Android Universel (Tous processeurs)** | Compatible 100% appareils Android (ARMv7, ARM64, x86, x86_64) |
          | 📱 **`YomuReader-debug.apk`** | **Android Debug / Dev** | Version de test avec React Native DevTools activés |
          | 💻 **`nHentai-Launcher-Portable.exe`** | **Windows 64-bit** | Exécutable autonome sans installation (lanceur Desktop complet) |
          | 🗜️ **`nhentai-launcher-source.zip`** | **Code Source** | Archive ZIP propre du code source Git |

          ---

          ### 🛡️ Empreintes d'intégrité (SHA-256)
          ```text
          EOF

          cat release-assets/SHA256SUMS.txt >> release_body.md

          cat << 'EOF' >> release_body.md
          ```

          ---
          <sub>*Paquets compilés et signés automatiquement par le pipeline CI/CD GitHub Actions.*</sub>
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: release_body.md
          files: release-assets/*
          draft: false
          prerelease: false
